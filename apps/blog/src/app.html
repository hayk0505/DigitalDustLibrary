<!doctype html>
<html lang="en">
	<head>
		<script>
			(function () {
				var stored = localStorage.getItem('dd-blog-theme');
				var theme =
					stored === 'light' || stored === 'dark'
						? stored
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
				document.documentElement.dataset.theme = theme;

				// Reader Mode's on/off flag, stamped the same way — lets
				// app.css hide the sidebar/player/scroll-button chrome via a
				// plain attribute selector before hydration runs, so a
				// returning reader-mode user's first paint doesn't flash the
				// full chrome first. See $lib/state/reader-mode.svelte.ts.
				document.documentElement.dataset.readerMode =
					localStorage.getItem('dd-blog-reader-mode') === 'on' ? 'on' : 'off';
			})();
		</script>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
